name: PostGIS (multi-version, multi-arch)

on:
  workflow_dispatch:
    inputs:
      versions_json:
        description: '["16-3.5","17-3.5","17-3.6"]'
        default: '["17-3.6"]'
        required: true
      flavors_json:
        description: '["alpine"] or ["alpine","debian"]'
        default: '["alpine"]'
        required: true
      arches_json:
        description: '["amd64","arm64"]'
        default: '["amd64","arm64"]'
        required: true
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/postgis
  UPSTREAM_REPO: https://github.com/postgis/docker-postgis.git
  UPSTREAM_REF: master

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions_json) }}
        flavor: ${{ fromJSON(inputs.flavors_json) }}
        arch: ${{ fromJSON(inputs.arches_json) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute paths and tags
        id: x
        run: |
          # Map flavor to upstream folder suffix and tag suffix
          case "${{ matrix.flavor }}" in
            alpine) FLAVOR_SUBDIR="/alpine"; FLAVOR_TAG="-alpine" ;;
            debian) FLAVOR_SUBDIR="";        FLAVOR_TAG="-debian" ;;
            *) echo "Unknown flavor: ${{ matrix.flavor }}"; exit 1 ;;
          esac

          CTX="${{ matrix.version }}${FLAVOR_SUBDIR}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          ARCH_TAG="${IMAGE}:${{ matrix.version }}${FLAVOR_TAG}-${{ matrix.arch }}"

          echo "context_folder=$CTX"   >> $GITHUB_OUTPUT
          echo "flavor_tag=$FLAVOR_TAG" >> $GITHUB_OUTPUT
          echo "arch_tag=$ARCH_TAG"     >> $GITHUB_OUTPUT

      - name: Build & push (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.UPSTREAM_REPO }}#${{ env.UPSTREAM_REF }}:${{ steps.x.outputs.context_folder }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.x.outputs.arch_tag }}

  manifest:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions_json) }}
        flavor: ${{ fromJSON(inputs.flavors_json) }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: y
        run: |
          case "${{ matrix.flavor }}" in
            alpine) FLAVOR_TAG="-alpine" ;;
            debian) FLAVOR_TAG="-debian" ;;
            *) echo "Unknown flavor: ${{ matrix.flavor }}"; exit 1 ;;
          esac

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          BASE="${IMAGE}:${{ matrix.version }}${FLAVOR_TAG}"

          echo "base=$BASE"  >> $GITHUB_OUTPUT
          echo "amd64=${BASE}-amd64" >> $GITHUB_OUTPUT
          echo "arm64=${BASE}-arm64" >> $GITHUB_OUTPUT

      - name: Create & push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.y.outputs.base }}" \
            "${{ steps.y.outputs.amd64 }}" \
            "${{ steps.y.outputs.arm64 }}"

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ steps.y.outputs.base }}"
